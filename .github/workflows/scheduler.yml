name: LeetLift Scheduler

on:
  schedule:
    # 临时注册探针；确认新调度器产生 schedule 事件后删除。
    - cron: "*/5 * * * *"
    # GitHub cron 使用 UTC；北京时间 10 点时段分四次兜底。
    # daily 工作流按日期幂等，四次触发实际最多发送一封邮件。
    - cron: "7,22,37,52 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    uses: ./.github/workflows/daily.yml
    secrets:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
