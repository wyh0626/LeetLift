name: Test LeetLift Delivery

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 要测试的邮件通道
        required: true
        default: config
        type: choice
        options:
          - config
          - resend
          - smtp
          - pushplus

permissions:
  contents: read

jobs:
  test-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DELIVERY_PROVIDER: ${{ inputs.provider == 'config' && vars.DELIVERY_PROVIDER || inputs.provider }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test delivery channel
        run: python -m leetlift delivery-test
