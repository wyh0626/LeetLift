name: Test LeetLift Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DELIVERY_PROVIDER: ${{ vars.DELIVERY_PROVIDER }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test delivery channel
        run: python -m leetlift delivery-test
